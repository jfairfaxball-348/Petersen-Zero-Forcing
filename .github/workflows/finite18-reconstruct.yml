name: Progressive n=18 reconstruction
# Recovery gate retriggered for batch-76 completion

on:
  push:
    branches: [lean-formalisation]
    paths:
      - ".github/workflows/finite18-reconstruct.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  LEAN_NUM_THREADS: 1
  SOURCE_TAG: "706d96dd43719a88f5f8"

jobs:
  reconstruct18:
    name: reconstruct-n18
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean structural dependencies
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteReduction PetersenZeroForcing.FiniteScanEighthSplit
          test: false
          lint: false
          use-github-cache: false

      - name: Wait for all batch artifacts covering n=18
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            missing=()
            for batch in $(seq 38 76); do
              name="finite1721-batch-${batch}-${SOURCE_TAG}"
              count="$(
                curl -fsSL \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=${name}" \
                | jq '[.artifacts[] | select(.expired == false)] | length'
              )"
              if [[ "$count" -eq 0 ]]; then
                missing+=("$batch")
              fi
            done
            if [[ "${#missing[@]}" -eq 0 ]]; then
              echo "All artifact names covering n=18 are available."
              exit 0
            fi
            echo "attempt=$attempt missing batches: ${missing[*]}"
            sleep 30
          done
          echo "Timed out waiting for n=18 artifact coverage." >&2
          exit 1

      - name: Restore latest compatible bundles for batches 38 through 76
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p batch-bundles
          for batch in $(seq 38 76); do
            name="finite1721-batch-${batch}-${SOURCE_TAG}"
            json="$(mktemp)"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=${name}" \
              -o "$json"
            artifact_id="$(
              jq -r '[.artifacts[] | select(.expired == false)]
                | sort_by(.created_at) | reverse | .[0].id // empty' "$json"
            )"
            rm -f "$json"
            test -n "$artifact_id"
            zip="$(mktemp)"
            curl -fsSL -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$zip"
            tmp="$(mktemp -d)"
            unzip -oq "$zip" -d "$tmp"
            rm -f "$zip"
            test -s "$tmp/source-tag.txt"
            test "$(cat "$tmp/source-tag.txt")" = "$SOURCE_TAG"
            cp -a "$tmp"/. batch-bundles/
            rm -rf "$tmp"
            echo "restored batch=$batch artifact=$artifact_id"
          done

      - name: Verify exact n=18 leaf coverage and install oleans
        shell: bash
        run: |
          set -euo pipefail
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          mkdir -p "$outdir" progress18
          mapfile -t sources < <(
            find PetersenZeroForcing -maxdepth 1 -type f -name 'FiniteScanCheck18*E[01].lean' -print | sort
          )
          test "${#sources[@]}" -eq 384

          missing=0
          : > progress18/missing-n18.txt
          for src in "${sources[@]}"; do
            module="$(basename "$src" .lean)"
            sha="$(sha256sum "$src" | awk '{print $1}')"
            olean="batch-bundles/$module.olean"
            sidecar="batch-bundles/$module.source.sha256"
            if [[ ! -s "$olean" || ! -s "$sidecar" || "$(cat "$sidecar")" != "$sha" ]]; then
              echo "$module" >> progress18/missing-n18.txt
              missing=$((missing + 1))
              continue
            fi
            cp "$olean" "$outdir/$module.olean"
          done
          echo "required=384" | tee progress18/coverage.txt
          echo "missing=$missing" | tee -a progress18/coverage.txt
          test "$missing" -eq 0

      - name: Reconstruct all six n=18 pairs and scan18_checked
        shell: bash
        run: |
          set -euo pipefail
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          for suffix in OuterPair0 OuterPair1 OuterPair2 InnerPair0 InnerPair1 InnerPair2; do
            stem="FiniteScanCheck18${suffix}"
            lake env lean "PetersenZeroForcing/${stem}.lean" -o "$outdir/${stem}.olean"
          done
          lake env lean PetersenZeroForcing/FiniteScanChecked18.lean \
            -o "$outdir/FiniteScanChecked18.olean"

      - name: Kernel-check the n=18 lower-bound interface
        shell: bash
        run: |
          set -euo pipefail
          cat > Check18.lean <<'EOF'
          import PetersenZeroForcing.FiniteReduction
          import PetersenZeroForcing.FiniteScanChecked18

          namespace PetersenZeroForcing

          example : 8 ≤ Z 18 := by
            exact lower_bound_of_reducedScan 18 (by omega) FiniteScan.scan18_checked

          end PetersenZeroForcing
          EOF
          lake env lean Check18.lean

      - name: Save progressive n=18 reconstruction evidence
        uses: actions/upload-artifact@v4
        with:
          name: finite18-reconstructed-${{ env.SOURCE_TAG }}
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck18OuterPair*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck18InnerPair*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked18.olean
            progress18/
          if-no-files-found: error
          retention-days: 90
