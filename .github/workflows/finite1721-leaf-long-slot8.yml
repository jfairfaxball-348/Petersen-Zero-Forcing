name: Recover very long batch-76 slot 8

on:
  push:
    branches: [lean-formalisation]
    paths:
      - ".github/workflows/finite1721-leaf-long-slot8.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  LEAN_NUM_THREADS: 1
  LEAF_TIMEOUT: 90m
  SOURCE_TAG: "706d96dd43719a88f5f8"

jobs:
  leaf:
    name: recover-b76-leaf-8-long
    runs-on: macos-15-intel
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Install GNU core utilities
        shell: bash
        run: |
          set -euo pipefail
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Identify exact leaf and verify source fingerprint
        id: leafmeta
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          while IFS= read -r src_path; do
            sources+=("$src_path")
          done < <(
            find PetersenZeroForcing -maxdepth 1 -type f \
              \( -name 'FiniteScanCheck17*E[01].lean' \
              -o -name 'FiniteScanCheck18*E[01].lean' \
              -o -name 'FiniteScanCheck19*E[01].lean' \
              -o -name 'FiniteScanCheck20*E[01].lean' \
              -o -name 'FiniteScanCheck21*E[01].lean' \) \
              -print | sort
          )
          test "${#sources[@]}" -eq 1920
          tag="$(
            {
              sha256sum lean-toolchain lake-manifest.json
              sha256sum \
                PetersenZeroForcing/Core.lean \
                PetersenZeroForcing/Forcing.lean \
                PetersenZeroForcing/FiniteScan.lean \
                PetersenZeroForcing/FiniteScanOctantSplit.lean \
                PetersenZeroForcing/FiniteScanEighthSplit.lean
              printf '%s\0' "${sources[@]}" | xargs -0 sha256sum
            } | sha256sum | cut -c1-20
          )"
          test "$tag" = "$SOURCE_TAG"
          src="${sources[768]}"
          module="$(basename "$src" .lean)"
          test "$module" = "FiniteScanCheck19InnerPair0O000H0Q0E0"
          sha="$(sha256sum "$src" | awk '{print $1}')"
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=finite1721-leaf-b76-s8-$SOURCE_TAG" >> "$GITHUB_OUTPUT"

      - name: Restore compatible leaf evidence if already preserved
        id: restore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.leafmeta.outputs.artifact }}
          MODULE: ${{ steps.leafmeta.outputs.module }}
          SHA: ${{ steps.leafmeta.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p leaf-out
          json="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=${ARTIFACT}" \
            -o "$json"
          artifact_id="$(
            jq -r '[.artifacts[] | select(.expired == false)]
              | sort_by(.created_at) | reverse | .[0].id // empty' "$json"
          )"
          rm -f "$json"
          reused=false
          if [[ -n "$artifact_id" ]]; then
            zip="$(mktemp)"
            tmp="$(mktemp -d)"
            if curl -fsSL -L \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                -o "$zip" \
              && unzip -oq "$zip" -d "$tmp" \
              && [[ -s "$tmp/source-tag.txt" ]] \
              && [[ "$(cat "$tmp/source-tag.txt")" == "$SOURCE_TAG" ]] \
              && [[ -s "$tmp/$MODULE.olean" ]] \
              && [[ -s "$tmp/$MODULE.source.sha256" ]] \
              && [[ "$(cat "$tmp/$MODULE.source.sha256")" == "$SHA" ]]; then
              cp -a "$tmp"/. leaf-out/
              reused=true
              echo "Reused compatible leaf artifact $artifact_id"
            fi
            rm -f "$zip"
            rm -rf "$tmp"
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Set up Lean structural dependencies
        if: steps.restore.outputs.reused != 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteScanEighthSplit
          test: false
          lint: false
          use-github-cache: false

      - name: Kernel-check exact long leaf
        if: steps.restore.outputs.reused != 'true'
        shell: bash
        env:
          SRC: ${{ steps.leafmeta.outputs.src }}
          MODULE: ${{ steps.leafmeta.outputs.module }}
          SHA: ${{ steps.leafmeta.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p leaf-out .lake/build/lib/lean/PetersenZeroForcing
          echo "checking $MODULE with timeout $LEAF_TIMEOUT"
          timeout --signal=TERM --kill-after=30s "$LEAF_TIMEOUT" \
            lake env lean "$SRC" -o ".lake/build/lib/lean/PetersenZeroForcing/$MODULE.olean"
          test -s ".lake/build/lib/lean/PetersenZeroForcing/$MODULE.olean"
          cp ".lake/build/lib/lean/PetersenZeroForcing/$MODULE.olean" "leaf-out/$MODULE.olean"
          printf '%s\n' "$SHA" > "leaf-out/$MODULE.source.sha256"
          printf '%s\n' "$SOURCE_TAG" > leaf-out/source-tag.txt
          printf '%s\n' "$MODULE" > leaf-out/module.txt

      - name: Upload independently preserved leaf
        if: steps.restore.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.leafmeta.outputs.artifact }}
          path: leaf-out/
          if-no-files-found: error
          retention-days: 90
