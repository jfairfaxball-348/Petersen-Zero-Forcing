name: Lean formalisation

on:
  push:
    branches: [main, lean-formalisation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  finite14-repair-shards:
    name: finite14-repair-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LEAN_NUM_THREADS: 1
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: outer-pair0-001-h0
            module: PetersenZeroForcing.FiniteScanCheck14OuterPair0O001H0
            stem: FiniteScanCheck14OuterPair0O001H0
          - name: outer-pair0-001-h1
            module: PetersenZeroForcing.FiniteScanCheck14OuterPair0O001H1
            stem: FiniteScanCheck14OuterPair0O001H1
          - name: inner-pair2-110-h0
            module: PetersenZeroForcing.FiniteScanCheck14InnerPair2O110H0
            stem: FiniteScanCheck14InnerPair2O110H0
          - name: inner-pair2-110-h1
            module: PetersenZeroForcing.FiniteScanCheck14InnerPair2O110H1
            stem: FiniteScanCheck14InnerPair2O110H1
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check repaired finite shard
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: ${{ matrix.module }}
          test: false
          lint: false
          use-github-cache: false
      - name: Save checked repaired module
        uses: actions/upload-artifact@v4
        with:
          name: finite14-repair-${{ matrix.name }}
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/${{ matrix.stem }}.olean
            .lake/build/lib/lean/PetersenZeroForcing/${{ matrix.stem }}.ilean
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: assemble
    needs: finite14-repair-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build non-computational Lean core
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteReduction PetersenZeroForcing.LargeLowerBound PetersenZeroForcing.FiniteScanOctantSplit
          test: false
          lint: false
          use-github-cache: false
      - name: Restore n=13 checked shards
        uses: actions/download-artifact@v5
        with:
          pattern: finite13-*
          path: .lake/build/lib/lean/PetersenZeroForcing
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 35996619272
      - name: Restore successful n=14 shards from run 134
        uses: actions/download-artifact@v5
        with:
          pattern: finite14-*
          path: .lake/build/lib/lean/PetersenZeroForcing
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 36005536222
      - name: Restore repaired n=14 split shards
        uses: actions/download-artifact@v5
        with:
          pattern: finite14-repair-*
          path: .lake/build/lib/lean/PetersenZeroForcing
          merge-multiple: true
      - name: Reconstruct timed-out n=14 octants
        shell: bash
        run: |
          set -euo pipefail
          for stem in \
            FiniteScanCheck14OuterPair0O001 \
            FiniteScanCheck14InnerPair2O110
          do
            lake env lean "PetersenZeroForcing/${stem}.lean" \
              -o ".lake/build/lib/lean/PetersenZeroForcing/${stem}.olean"
          done
      - name: Assemble finite scans through n=14 and root module
        shell: bash
        run: |
          set -euo pipefail
          for n in 13 14
          do
            for suffix in \
              OuterPair0 \
              OuterPair1 \
              OuterPair2 \
              InnerPair0 \
              InnerPair1 \
              InnerPair2
            do
              stem="FiniteScanCheck${n}${suffix}"
              lake env lean "PetersenZeroForcing/${stem}.lean" \
                -o ".lake/build/lib/lean/PetersenZeroForcing/${stem}.olean"
            done
          done
          lake env lean PetersenZeroForcing/FiniteScanChecked.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked.olean
          lake env lean PetersenZeroForcing/FiniteScanChecked14.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked14.olean
          lake env lean PetersenZeroForcing/FiniteLowerBound.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteLowerBound.olean
          lake env lean PetersenZeroForcing.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing.olean
      - name: Save cumulative finite checked modules
        uses: actions/upload-artifact@v4
        with:
          name: finite-checked-through-14
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanOctantSplit.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck13*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck14*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteLowerBound.olean
          if-no-files-found: error
          retention-days: 90
