name: Lean formalisation

on:
  push:
    branches: [main, lean-formalisation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finite13-shards:
    name: finite13-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LEAN_NUM_THREADS: 1
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: outer-pair0-000
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0O000
            stem: FiniteScanCheck13OuterPair0O000
          - name: outer-pair0-001
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0O001
            stem: FiniteScanCheck13OuterPair0O001
          - name: outer-pair0-010
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0O010
            stem: FiniteScanCheck13OuterPair0O010
          - name: outer-pair0-011
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0O011
            stem: FiniteScanCheck13OuterPair0O011
          - name: outer-pair0-100
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0O100
            stem: FiniteScanCheck13OuterPair0O100
          - name: outer-pair0-101
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0O101
            stem: FiniteScanCheck13OuterPair0O101
          - name: outer-pair0-110
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0O110
            stem: FiniteScanCheck13OuterPair0O110
          - name: outer-pair0-111
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0O111
            stem: FiniteScanCheck13OuterPair0O111
          - name: outer-pair1-000
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1O000
            stem: FiniteScanCheck13OuterPair1O000
          - name: outer-pair1-001
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1O001
            stem: FiniteScanCheck13OuterPair1O001
          - name: outer-pair1-010
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1O010
            stem: FiniteScanCheck13OuterPair1O010
          - name: outer-pair1-011
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1O011
            stem: FiniteScanCheck13OuterPair1O011
          - name: outer-pair1-100
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1O100
            stem: FiniteScanCheck13OuterPair1O100
          - name: outer-pair1-101
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1O101
            stem: FiniteScanCheck13OuterPair1O101
          - name: outer-pair1-110
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1O110
            stem: FiniteScanCheck13OuterPair1O110
          - name: outer-pair1-111
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1O111
            stem: FiniteScanCheck13OuterPair1O111
          - name: outer-pair2-000
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2O000
            stem: FiniteScanCheck13OuterPair2O000
          - name: outer-pair2-001
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2O001
            stem: FiniteScanCheck13OuterPair2O001
          - name: outer-pair2-010
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2O010
            stem: FiniteScanCheck13OuterPair2O010
          - name: outer-pair2-011
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2O011
            stem: FiniteScanCheck13OuterPair2O011
          - name: outer-pair2-100
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2O100
            stem: FiniteScanCheck13OuterPair2O100
          - name: outer-pair2-101
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2O101
            stem: FiniteScanCheck13OuterPair2O101
          - name: outer-pair2-110
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2O110
            stem: FiniteScanCheck13OuterPair2O110
          - name: outer-pair2-111
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2O111
            stem: FiniteScanCheck13OuterPair2O111
          - name: inner-pair0-000
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0O000
            stem: FiniteScanCheck13InnerPair0O000
          - name: inner-pair0-001
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0O001
            stem: FiniteScanCheck13InnerPair0O001
          - name: inner-pair0-010
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0O010
            stem: FiniteScanCheck13InnerPair0O010
          - name: inner-pair0-011
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0O011
            stem: FiniteScanCheck13InnerPair0O011
          - name: inner-pair0-100
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0O100
            stem: FiniteScanCheck13InnerPair0O100
          - name: inner-pair0-101
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0O101
            stem: FiniteScanCheck13InnerPair0O101
          - name: inner-pair0-110
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0O110
            stem: FiniteScanCheck13InnerPair0O110
          - name: inner-pair0-111
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0O111
            stem: FiniteScanCheck13InnerPair0O111
          - name: inner-pair1-000
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1O000
            stem: FiniteScanCheck13InnerPair1O000
          - name: inner-pair1-001
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1O001
            stem: FiniteScanCheck13InnerPair1O001
          - name: inner-pair1-010
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1O010
            stem: FiniteScanCheck13InnerPair1O010
          - name: inner-pair1-011
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1O011
            stem: FiniteScanCheck13InnerPair1O011
          - name: inner-pair1-100
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1O100
            stem: FiniteScanCheck13InnerPair1O100
          - name: inner-pair1-101
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1O101
            stem: FiniteScanCheck13InnerPair1O101
          - name: inner-pair1-110
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1O110
            stem: FiniteScanCheck13InnerPair1O110
          - name: inner-pair1-111
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1O111
            stem: FiniteScanCheck13InnerPair1O111
          - name: inner-pair2-000
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2O000
            stem: FiniteScanCheck13InnerPair2O000
          - name: inner-pair2-001
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2O001
            stem: FiniteScanCheck13InnerPair2O001
          - name: inner-pair2-010
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2O010
            stem: FiniteScanCheck13InnerPair2O010
          - name: inner-pair2-011
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2O011
            stem: FiniteScanCheck13InnerPair2O011
          - name: inner-pair2-100
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2O100
            stem: FiniteScanCheck13InnerPair2O100
          - name: inner-pair2-101
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2O101
            stem: FiniteScanCheck13InnerPair2O101
          - name: inner-pair2-110
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2O110
            stem: FiniteScanCheck13InnerPair2O110
          - name: inner-pair2-111
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2O111
            stem: FiniteScanCheck13InnerPair2O111
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check finite shard
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: ${{ matrix.module }}
          test: false
          lint: false
          use-github-cache: false
      - name: Save checked module
        uses: actions/upload-artifact@v4
        with:
          name: finite13-${{ matrix.name }}
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/${{ matrix.stem }}.olean
            .lake/build/lib/lean/PetersenZeroForcing/${{ matrix.stem }}.ilean
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: assemble
    needs: finite13-shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build non-computational Lean core
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteReduction PetersenZeroForcing.LargeLowerBound
          test: false
          lint: false
          use-github-cache: false
      - name: Restore checked finite shards
        uses: actions/download-artifact@v5
        with:
          pattern: finite13-*
          path: .lake/build/lib/lean/PetersenZeroForcing
          merge-multiple: true
      - name: Assemble n=13 scan and root module
        shell: bash
        run: |
          set -euo pipefail
          for stem in \
            FiniteScanCheck13OuterPair0 \
            FiniteScanCheck13OuterPair1 \
            FiniteScanCheck13OuterPair2 \
            FiniteScanCheck13InnerPair0 \
            FiniteScanCheck13InnerPair1 \
            FiniteScanCheck13InnerPair2
          do
            lake env lean "PetersenZeroForcing/${stem}.lean" \
              -o ".lake/build/lib/lean/PetersenZeroForcing/${stem}.olean"
          done
          lake env lean PetersenZeroForcing/FiniteScanChecked.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked.olean
          lake env lean PetersenZeroForcing.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing.olean
