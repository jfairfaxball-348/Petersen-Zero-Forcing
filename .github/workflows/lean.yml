name: Lean formalisation

on:
  push:
    branches: [main, lean-formalisation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finite13-shards:
    name: finite13-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEAN_NUM_THREADS: 1
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: outer-pair0-00
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0Q00
            stem: FiniteScanCheck13OuterPair0Q00
          - name: outer-pair0-01
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0Q01
            stem: FiniteScanCheck13OuterPair0Q01
          - name: outer-pair0-10
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0Q10
            stem: FiniteScanCheck13OuterPair0Q10
          - name: outer-pair0-11
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair0Q11
            stem: FiniteScanCheck13OuterPair0Q11
          - name: outer-pair1-00
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1Q00
            stem: FiniteScanCheck13OuterPair1Q00
          - name: outer-pair1-01
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1Q01
            stem: FiniteScanCheck13OuterPair1Q01
          - name: outer-pair1-10
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1Q10
            stem: FiniteScanCheck13OuterPair1Q10
          - name: outer-pair1-11
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair1Q11
            stem: FiniteScanCheck13OuterPair1Q11
          - name: outer-pair2-00
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2Q00
            stem: FiniteScanCheck13OuterPair2Q00
          - name: outer-pair2-01
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2Q01
            stem: FiniteScanCheck13OuterPair2Q01
          - name: outer-pair2-10
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2Q10
            stem: FiniteScanCheck13OuterPair2Q10
          - name: outer-pair2-11
            module: PetersenZeroForcing.FiniteScanCheck13OuterPair2Q11
            stem: FiniteScanCheck13OuterPair2Q11
          - name: inner-pair0-00
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0Q00
            stem: FiniteScanCheck13InnerPair0Q00
          - name: inner-pair0-01
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0Q01
            stem: FiniteScanCheck13InnerPair0Q01
          - name: inner-pair0-10
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0Q10
            stem: FiniteScanCheck13InnerPair0Q10
          - name: inner-pair0-11
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair0Q11
            stem: FiniteScanCheck13InnerPair0Q11
          - name: inner-pair1-00
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1Q00
            stem: FiniteScanCheck13InnerPair1Q00
          - name: inner-pair1-01
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1Q01
            stem: FiniteScanCheck13InnerPair1Q01
          - name: inner-pair1-10
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1Q10
            stem: FiniteScanCheck13InnerPair1Q10
          - name: inner-pair1-11
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair1Q11
            stem: FiniteScanCheck13InnerPair1Q11
          - name: inner-pair2-00
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2Q00
            stem: FiniteScanCheck13InnerPair2Q00
          - name: inner-pair2-01
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2Q01
            stem: FiniteScanCheck13InnerPair2Q01
          - name: inner-pair2-10
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2Q10
            stem: FiniteScanCheck13InnerPair2Q10
          - name: inner-pair2-11
            module: PetersenZeroForcing.FiniteScanCheck13InnerPair2Q11
            stem: FiniteScanCheck13InnerPair2Q11
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check finite shard
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: ${{ matrix.module }}
          test: false
          lint: false
          use-github-cache: false
      - name: Save checked module
        uses: actions/upload-artifact@v4
        with:
          name: finite13-${{ matrix.name }}
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/${{ matrix.stem }}.olean
            .lake/build/lib/lean/PetersenZeroForcing/${{ matrix.stem }}.ilean
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: assemble
    needs: finite13-shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build non-computational Lean core
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteReduction PetersenZeroForcing.LargeLowerBound
          test: false
          lint: false
          use-github-cache: false
      - name: Restore checked finite shards
        uses: actions/download-artifact@v5
        with:
          pattern: finite13-*
          path: .lake/build/lib/lean/PetersenZeroForcing
          merge-multiple: true
      - name: Assemble n=13 scan and root module
        shell: bash
        run: |
          set -euo pipefail
          for stem in \
            FiniteScanCheck13OuterPair0 \
            FiniteScanCheck13OuterPair1 \
            FiniteScanCheck13OuterPair2 \
            FiniteScanCheck13InnerPair0 \
            FiniteScanCheck13InnerPair1 \
            FiniteScanCheck13InnerPair2
          do
            lake env lean "PetersenZeroForcing/${stem}.lean" \
              -o ".lake/build/lib/lean/PetersenZeroForcing/${stem}.olean"
          done
          lake env lean PetersenZeroForcing/FiniteScanChecked.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked.olean
          lake env lean PetersenZeroForcing.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing.olean
