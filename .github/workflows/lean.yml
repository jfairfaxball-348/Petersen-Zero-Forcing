name: Lean formalisation

on:
  push:
    branches: [main, lean-formalisation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-sharded-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  finite15-shards:
    name: finite15-${{ matrix.pair.name }}-${{ matrix.octant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: 1
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pair:
          - name: outer-pair0
            stem: OuterPair0
          - name: outer-pair1
            stem: OuterPair1
          - name: outer-pair2
            stem: OuterPair2
          - name: inner-pair0
            stem: InnerPair0
          - name: inner-pair1
            stem: InnerPair1
          - name: inner-pair2
            stem: InnerPair2
        octant: ["000", "001", "010", "011", "100", "101", "110", "111"]
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check finite shard
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteScanCheck15${{ matrix.pair.stem }}O${{ matrix.octant }}
          test: false
          lint: false
          use-github-cache: false
      - name: Save checked module
        uses: actions/upload-artifact@v4
        with:
          name: finite15-${{ matrix.pair.name }}-${{ matrix.octant }}
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck15${{ matrix.pair.stem }}O${{ matrix.octant }}.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck15${{ matrix.pair.stem }}O${{ matrix.octant }}.ilean
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: assemble
    needs: finite15-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build non-computational Lean core
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteReduction PetersenZeroForcing.LargeLowerBound
          test: false
          lint: false
          use-github-cache: false
      - name: Restore checked finite modules through n=14
        uses: actions/download-artifact@v5
        with:
          name: finite-checked-through-14
          path: .lake/build/lib/lean/PetersenZeroForcing
          github-token: ${{ github.token }}
          run-id: 36018908671
      - name: Restore n=15 checked shards
        uses: actions/download-artifact@v5
        with:
          pattern: finite15-*
          path: .lake/build/lib/lean/PetersenZeroForcing
          merge-multiple: true
      - name: Assemble n=15 and root module
        shell: bash
        run: |
          set -euo pipefail
          for suffix in \
            OuterPair0 \
            OuterPair1 \
            OuterPair2 \
            InnerPair0 \
            InnerPair1 \
            InnerPair2
          do
            stem="FiniteScanCheck15${suffix}"
            lake env lean "PetersenZeroForcing/${stem}.lean" \
              -o ".lake/build/lib/lean/PetersenZeroForcing/${stem}.olean"
          done
          lake env lean PetersenZeroForcing/FiniteScanChecked15.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked15.olean
          lake env lean PetersenZeroForcing/FiniteLowerBound.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteLowerBound.olean
          lake env lean PetersenZeroForcing.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing.olean
      - name: Save cumulative finite checked modules
        uses: actions/upload-artifact@v4
        with:
          name: finite-checked-through-15
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanOctantSplit.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck13*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck14*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck15*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteLowerBound.olean
          if-no-files-found: error
          retention-days: 90
