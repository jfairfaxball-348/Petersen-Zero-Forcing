name: Lean formalisation

on:
  push:
    branches: [main, lean-formalisation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  finite14-shards:
    name: finite14-${{ matrix.pair.name }}-${{ matrix.octant }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LEAN_NUM_THREADS: 1
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pair:
          - name: outer-pair0
            stem: OuterPair0
          - name: outer-pair1
            stem: OuterPair1
          - name: outer-pair2
            stem: OuterPair2
          - name: inner-pair0
            stem: InnerPair0
          - name: inner-pair1
            stem: InnerPair1
          - name: inner-pair2
            stem: InnerPair2
        octant: ["000", "001", "010", "011", "100", "101", "110", "111"]
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check finite shard
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteScanCheck14${{ matrix.pair.stem }}O${{ matrix.octant }}
          test: false
          lint: false
          use-github-cache: false
      - name: Save checked module
        uses: actions/upload-artifact@v4
        with:
          name: finite14-${{ matrix.pair.name }}-${{ matrix.octant }}
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck14${{ matrix.pair.stem }}O${{ matrix.octant }}.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck14${{ matrix.pair.stem }}O${{ matrix.octant }}.ilean
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: assemble
    needs: finite14-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build non-computational Lean core
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteReduction PetersenZeroForcing.LargeLowerBound
          test: false
          lint: false
          use-github-cache: false
      - name: Restore n=13 checked shards
        uses: actions/download-artifact@v5
        with:
          pattern: finite13-*
          path: .lake/build/lib/lean/PetersenZeroForcing
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 35996619272
      - name: Restore n=14 checked shards
        uses: actions/download-artifact@v5
        with:
          pattern: finite14-*
          path: .lake/build/lib/lean/PetersenZeroForcing
          merge-multiple: true
      - name: Assemble finite scans through n=14 and root module
        shell: bash
        run: |
          set -euo pipefail
          for n in 13 14
          do
            for suffix in \
              OuterPair0 \
              OuterPair1 \
              OuterPair2 \
              InnerPair0 \
              InnerPair1 \
              InnerPair2
            do
              stem="FiniteScanCheck${n}${suffix}"
              lake env lean "PetersenZeroForcing/${stem}.lean" \
                -o ".lake/build/lib/lean/PetersenZeroForcing/${stem}.olean"
            done
          done
          lake env lean PetersenZeroForcing/FiniteScanChecked.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked.olean
          lake env lean PetersenZeroForcing/FiniteScanChecked14.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked14.olean
          lake env lean PetersenZeroForcing/FiniteLowerBound.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing/FiniteLowerBound.olean
          lake env lean PetersenZeroForcing.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing.olean
      - name: Save cumulative finite checked modules
        uses: actions/upload-artifact@v4
        with:
          name: finite-checked-through-14
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck13*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck14*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteLowerBound.olean
          if-no-files-found: error
          retention-days: 90
