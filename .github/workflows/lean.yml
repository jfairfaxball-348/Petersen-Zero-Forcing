name: Lean formalisation

on:
  push:
    branches: [main, lean-formalisation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-halves-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  finite15-quarter-shards:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEAN_NUM_THREADS: 1
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - artifact: finite15-outer-pair1-111-h1-q0
            module: FiniteScanCheck15OuterPair1O111H1Q0
          - artifact: finite15-outer-pair1-111-h1-q1
            module: FiniteScanCheck15OuterPair1O111H1Q1
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-check recursive quarter leaf
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.${{ matrix.module }}
          test: false
          lint: false
          use-github-cache: false
      - name: Save checked quarter leaf
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/${{ matrix.module }}.olean
            .lake/build/lib/lean/PetersenZeroForcing/${{ matrix.module }}.ilean
          if-no-files-found: error
          retention-days: 2
