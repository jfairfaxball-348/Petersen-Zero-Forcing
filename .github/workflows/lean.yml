name: Lean formalisation

on:
  push:
    branches: [main, lean-formalisation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: cheap-source-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build non-computational Lean core
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteReduction PetersenZeroForcing.LargeLowerBound PetersenZeroForcing.FiniteScanOctantSplit PetersenZeroForcing.FiniteScanEighthSplit PetersenZeroForcing.FiniteScanCheck17OuterPair0O000H0Q0E0
          test: false
          lint: false
          use-github-cache: false
      - name: Guard finite proof sources against prohibited shortcuts
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\\b(native_decide|sorry|admit)\\b' PetersenZeroForcing/FiniteScan*.lean PetersenZeroForcing/FiniteLowerBound.lean; then
            echo "Prohibited proof shortcut found in finite lower-bound sources." >&2
            exit 1
          fi
