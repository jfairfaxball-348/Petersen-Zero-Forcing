name: Verify Windows leaf olean portability

on:
  push:
    branches: [lean-formalisation]
    paths:
      - ".github/workflows/verify-windows-leaf-portability.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_TAG: "706d96dd43719a88f5f8"
  ARTIFACT: "finite1721-leaf-b77-s3-706d96dd43719a88f5f8"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Lean dependencies
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteScanEighthSplit
          test: false
          lint: false
          use-github-cache: true

      - name: Restore and verify Windows-produced exact leaf
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=${ARTIFACT}" \
            -o "$json"
          artifact_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' "$json")"
          test -n "$artifact_id"
          zip="$(mktemp)"
          tmp="$(mktemp -d)"
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$zip"
          unzip -oq "$zip" -d "$tmp"
          test "$(cat "$tmp/source-tag.txt")" = "$SOURCE_TAG"
          module="$(cat "$tmp/module.txt")"
          src="PetersenZeroForcing/$module.lean"
          test -s "$src"
          sha="$(sha256sum "$src" | awk '{print $1}')"
          test "$(cat "$tmp/$module.source.sha256")" = "$sha"
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          cp "$tmp/$module.olean" "$outdir/$module.olean"
          printf 'import PetersenZeroForcing.%s\n' "$module" > CheckWindowsLeaf.lean
          lake env lean CheckWindowsLeaf.lean
          echo "portable Windows olean accepted: $module"
