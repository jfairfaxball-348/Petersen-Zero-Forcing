name: Cancel stale finite campaign

on:
  push:
    branches: [lean-formalisation]
    paths:
      - ".github/workflows/cancel-stale-finite.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel obsolete four-lane campaign
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=36070959552
          code="$(curl -sS -o /tmp/force-cancel.json -w '%{http_code}' -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel")"
          if [[ "${code}" != "202" && "${code}" != "409" ]]; then
            cat /tmp/force-cancel.json >&2
            exit 1
          fi
