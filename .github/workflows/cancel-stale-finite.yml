name: Cancel stale finite campaign

on:
  push:
    branches: [lean-formalisation]
    paths:
      - ".github/workflows/cancel-stale-finite.yml"

concurrency:
  group: finite17-21-microbatch-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm overlap guard
        run: echo "The v3 concurrency guard cancels any unintended overlapping finite campaign."
