name: Cancel stale finite campaign

on:
  push:
    branches: [lean-formalisation]
    paths:
      - ".github/workflows/cancel-stale-finite.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale finite/recovery runs after preserving artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 36106974169 36111977679 36123878190 36124255337; do
            echo "requesting cancellation of stale run $run_id"
            code="$(
              curl -sS -o /tmp/cancel-${run_id}.out -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"
            )"
            cat /tmp/cancel-${run_id}.out || true
            echo
            echo "run=$run_id http=$code"
            case "$code" in
              202|409) ;;
              *) echo "Unexpected cancellation response for $run_id" >&2; exit 1 ;;
            esac
          done
