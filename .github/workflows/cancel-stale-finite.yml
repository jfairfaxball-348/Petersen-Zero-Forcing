name: Cancel stale finite campaign

on:
  push:
    branches: [lean-formalisation]
    paths:
      - ".github/workflows/cancel-stale-finite.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale finite and obsolete leaf runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 36106974169 36124737667 36124922957 36131018655 36131172580 36131819439 36131875089 36132217225 36131094219 36135874108 36141763993 36141763997 36142676895 36142287601 36142419380 36142419353 36149656998 36149657199 36153322761 36152718364 36152718255 36158357480 36160773463 36159511932; do
            code="$(
              curl -sS -o /tmp/force-cancel-${run_id}.out -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel"
            )"
            cat /tmp/force-cancel-${run_id}.out || true
            echo
            echo "run=$run_id http=$code"
            case "$code" in
              202|409) ;;
              *) echo "Unexpected force-cancel response for $run_id" >&2; exit 1 ;;
            esac
          done
