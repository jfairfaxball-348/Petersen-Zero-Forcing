name: Finite n=17-21 worker 6 recovery

on:
  workflow_dispatch:

concurrency:
  group: finite17-21-worker6-recovery-v1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  LEAN_NUM_THREADS: 1
  LEAF_TIMEOUT: 45m
  WORKER_COUNT: "10"
  LANES_PER_WORKER: "4"
  WORKER: "6"

jobs:
  recover-worker6:
    name: finite17-21-worker-6-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean structural dependencies
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteScanEighthSplit
          test: false
          lint: false
          use-github-cache: false
      - name: Compute compatible source fingerprint
        id: fp
        shell: bash
        run: |
          set -euo pipefail
          tag="$(
            {
              sha256sum lean-toolchain lake-manifest.json
              sha256sum PetersenZeroForcing/FiniteScan.lean
              sha256sum PetersenZeroForcing/FiniteScanOctantSplit.lean
              sha256sum PetersenZeroForcing/FiniteScanEighthSplit.lean
              find PetersenZeroForcing -maxdepth 1 -type f                 \( -name 'FiniteScanCheck17*E[01].lean'                 -o -name 'FiniteScanCheck18*E[01].lean'                 -o -name 'FiniteScanCheck19*E[01].lean'                 -o -name 'FiniteScanCheck20*E[01].lean'                 -o -name 'FiniteScanCheck21*E[01].lean' \)                 -print0 | sort -z | xargs -0 sha256sum
            } | sha256sum | cut -c1-20
          )"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source fingerprint: $tag"
      - name: Restore compatible worker-6 bundle if available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.fp.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p worker-out .lake/build/lib/lean/PetersenZeroForcing
          artifact_name="finite1721-worker-6-$TAG"
          json="$(mktemp)"
          trap 'rm -f "$json"' EXIT
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$artifact_name"             -o "$json"
          artifact_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' "$json")"
          if [[ -n "$artifact_id" ]]; then
            zip="$(mktemp)"
            curl -fsSL -L               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               -o "$zip"
            unzip -oq "$zip" -d worker-out
            rm -f "$zip"
            echo "Restored compatible artifact $artifact_id"
          else
            echo "No compatible worker-6 artifact found."
          fi
          shopt -s nullglob
          for f in worker-out/*.olean; do cp "$f" .lake/build/lib/lean/PetersenZeroForcing/; done
      - name: Kernel-check worker-6 exact eighth leaves
        shell: bash
        env:
          TAG: ${{ steps.fp.outputs.tag }}
        run: |
          set -u -o pipefail
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          mkdir -p worker-out "$outdir"
          echo "$TAG" > worker-out/source-tag.txt
          mapfile -t sources < <(
            find PetersenZeroForcing -maxdepth 1 -type f               \( -name 'FiniteScanCheck17*E[01].lean'               -o -name 'FiniteScanCheck18*E[01].lean'               -o -name 'FiniteScanCheck19*E[01].lean'               -o -name 'FiniteScanCheck20*E[01].lean'               -o -name 'FiniteScanCheck21*E[01].lean' \)               -print | sort
          )
          test "${#sources[@]}" -eq 1920 || exit 1
          stripes=$((WORKER_COUNT * LANES_PER_WORKER))
          run_lane() {
            local lane="$1"
            local stripe=$((WORKER * LANES_PER_WORKER + lane))
            local manifest="worker-out/manifest-w6-lane$lane.tsv"
            local hard="worker-out/hardfail-w6-lane$lane"
            rm -f "$hard"
            printf "module\tstatus\trc\tseconds\tsource_sha256\n" > "$manifest"
            local ordinal=0 src module sha sidecar status rc start end seconds
            for src in "${sources[@]}"; do
              if (( ordinal % stripes == stripe )); then
                module="$(basename "$src" .lean)"
                sha="$(sha256sum "$src" | awk '{print $1}')"
                sidecar="worker-out/$module.source.sha256"
                rc=0
                start="$(date +%s)"
                if [[ -s "worker-out/$module.olean" && -s "$sidecar" && "$(cat "$sidecar")" == "$sha" ]]; then
                  cp "worker-out/$module.olean" "$outdir/$module.olean"
                  status="reused"
                else
                  rm -f "$outdir/$module.olean"
                  echo "worker=6 lane=$lane checking $module"
                  if timeout --signal=TERM --kill-after=30s "$LEAF_TIMEOUT" lake env lean "$src" -o "$outdir/$module.olean"; then
                    if [[ -s "$outdir/$module.olean" ]]; then
                      cp "$outdir/$module.olean" "worker-out/$module.olean"
                      printf "%s\n" "$sha" > "$sidecar"
                      status="success"
                    else
                      status="lean-failure-no-olean"; rc=97; touch "$hard"
                    fi
                  else
                    rc=$?
                    rm -f "$outdir/$module.olean"
                    if [[ $rc -eq 124 || $rc -eq 137 || $rc -eq 143 ]]; then
                      status="timeout"
                    else
                      status="lean-failure-$rc"; touch "$hard"
                    fi
                  fi
                fi
                end="$(date +%s)"; seconds=$((end-start))
                printf "%s\t%s\t%s\t%s\t%s\n" "$module" "$status" "$rc" "$seconds" "$sha" >> "$manifest"
              fi
              ordinal=$((ordinal+1))
            done
          }
          pids=()
          for lane in 0 1 2 3; do run_lane "$lane" & pids+=("$!"); done
          lane_fail=0
          for pid in "${pids[@]}"; do wait "$pid" || lane_fail=1; done
          shopt -s nullglob
          hard_files=(worker-out/hardfail-w6-lane*)
          if (( ${#hard_files[@]} > 0 || lane_fail != 0 )); then exit 1; fi
      - name: Upload resumable worker-6 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite1721-worker-6-${{ steps.fp.outputs.tag }}
          path: worker-out/
          if-no-files-found: error
          retention-days: 90
