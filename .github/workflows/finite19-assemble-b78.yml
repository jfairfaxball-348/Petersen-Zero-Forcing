name: Assemble completed n=19 batch 78

on:
  push:
    branches: [lean-formalisation]
    paths:
      - ".github/workflows/finite19-assemble-b78.yml"
  workflow_dispatch:

concurrency:
  group: finite19-assemble-b78
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  SOURCE_TAG: "706d96dd43719a88f5f8"
  BATCH: "78"

jobs:
  assemble:
    name: assemble-batch-78-from-certified-leaves
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore ten certified leaves and verify exact source SHAs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p batch-out
          printf '%s\n' "$SOURCE_TAG" > batch-out/source-tag.txt
          key="$(printf '%03d' "$BATCH")"
          manifest="batch-out/manifest-batch-$key.tsv"
          printf "module\tstatus\trc\tseconds\tsource_sha256\n" > "$manifest"

          mapfile -t sources < <(
            find PetersenZeroForcing -maxdepth 1 -type f \
              \( -name 'FiniteScanCheck17*E[01].lean' \
              -o -name 'FiniteScanCheck18*E[01].lean' \
              -o -name 'FiniteScanCheck19*E[01].lean' \
              -o -name 'FiniteScanCheck20*E[01].lean' \
              -o -name 'FiniteScanCheck21*E[01].lean' \) \
              -print | sort
          )
          test "${#sources[@]}" -eq 1920
          start=$((BATCH * 10))

          for slot in $(seq 0 9); do
            src="${sources[$((start + slot))]}"
            module="$(basename "$src" .lean)"
            sha="$(sha256sum "$src" | awk '{print $1}')"
            name="finite1721-leaf-b${BATCH}-s${slot}-${SOURCE_TAG}"

            json="$(mktemp)"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=${name}" \
              -o "$json"
            artifact_id="$(
              jq -r '[.artifacts[] | select(.expired == false)]
                | sort_by(.created_at) | reverse | .[0].id // empty' "$json"
            )"
            rm -f "$json"
            test -n "$artifact_id"

            zip="$(mktemp)"
            tmp="$(mktemp -d)"
            curl -fsSL -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$zip"
            unzip -oq "$zip" -d "$tmp"
            rm -f "$zip"

            test -s "$tmp/source-tag.txt"
            test "$(cat "$tmp/source-tag.txt")" = "$SOURCE_TAG"
            test -s "$tmp/$module.olean"
            test -s "$tmp/$module.source.sha256"
            test "$(cat "$tmp/$module.source.sha256")" = "$sha"

            cp "$tmp/$module.olean" "batch-out/$module.olean"
            cp "$tmp/$module.source.sha256" "batch-out/$module.source.sha256"
            rm -rf "$tmp"
            printf "%s\tsuccess\t0\t0\t%s\n" "$module" "$sha" >> "$manifest"
          done

          test "$(find batch-out -maxdepth 1 -type f -name '*.olean' | wc -l)" -eq 10
          test "$(find batch-out -maxdepth 1 -type f -name '*.source.sha256' | wc -l)" -eq 10
          echo complete > batch-out/COMPLETE

      - name: Upload standard compatible batch bundle
        uses: actions/upload-artifact@v4
        with:
          name: finite1721-batch-78-${{ env.SOURCE_TAG }}
          path: batch-out/
          if-no-files-found: error
          retention-days: 90
