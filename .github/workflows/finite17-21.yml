name: Finite n=17-21 campaign

on:
  push:
    branches: [lean-formalisation]
    paths:
      - ".github/workflows/finite17-21.yml"
      - ".github/finite17-21-trigger"
  workflow_dispatch:

concurrency:
  group: finite17-21-microbatch-v3-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  LEAN_NUM_THREADS: 1
  LEAF_TIMEOUT: 45m
  BATCH_SIZE: "10"
  BATCH_COUNT: "192"
  FINITE16_RUN_ID: "36069897985"

jobs:
  preflight:
    name: finite17-21-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      batches: ${{ steps.plan.outputs.batches }}
      complete_count: ${{ steps.plan.outputs.complete_count }}
      incomplete_count: ${{ steps.plan.outputs.incomplete_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Fingerprint sources and plan only incomplete batches
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t sources < <(
            find PetersenZeroForcing -maxdepth 1 -type f \
              \( -name 'FiniteScanCheck17*E[01].lean' \
              -o -name 'FiniteScanCheck18*E[01].lean' \
              -o -name 'FiniteScanCheck19*E[01].lean' \
              -o -name 'FiniteScanCheck20*E[01].lean' \
              -o -name 'FiniteScanCheck21*E[01].lean' \) \
              -print | sort
          )
          test "${#sources[@]}" -eq 1920

          tag="$(
            {
              sha256sum lean-toolchain lake-manifest.json
              sha256sum \
                PetersenZeroForcing/Core.lean \
                PetersenZeroForcing/Forcing.lean \
                PetersenZeroForcing/FiniteScan.lean \
                PetersenZeroForcing/FiniteScanOctantSplit.lean \
                PetersenZeroForcing/FiniteScanEighthSplit.lean
              printf '%s\0' "${sources[@]}" | xargs -0 sha256sum
            } | sha256sum | cut -c1-20
          )"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source fingerprint: $tag"

          mkdir -p planner
          : > planner/complete-batches.txt
          : > planner/incomplete-batches.txt
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          for batch in $(seq 0 191); do
            artifact_name="finite1721-batch-$batch-$tag"
            meta="$tmp/meta-$batch.json"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$artifact_name" \
              -o "$meta"
            artifact_id="$(
              jq -r '[.artifacts[] | select(.expired == false)]
                | sort_by(.created_at) | reverse | .[0].id // empty' "$meta"
            )"

            ok=1
            if [[ -z "$artifact_id" ]]; then
              ok=0
            else
              zip="$tmp/$batch.zip"
              dir="$tmp/batch-$batch"
              mkdir -p "$dir"
              if ! curl -fsSL -L \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                    -o "$zip"; then
                ok=0
              elif ! unzip -oq "$zip" -d "$dir"; then
                ok=0
              elif [[ ! -s "$dir/source-tag.txt" || "$(cat "$dir/source-tag.txt")" != "$tag" ]]; then
                ok=0
              else
                start=$((batch * BATCH_SIZE))
                for offset in $(seq 0 9); do
                  src="${sources[start + offset]}"
                  module="$(basename "$src" .lean)"
                  sha="$(sha256sum "$src" | awk '{print $1}')"
                  if [[ ! -s "$dir/$module.olean" \
                        || ! -s "$dir/$module.source.sha256" \
                        || "$(cat "$dir/$module.source.sha256")" != "$sha" ]]; then
                    ok=0
                    break
                  fi
                done
              fi
            fi

            if (( ok == 1 )); then
              echo "$batch" >> planner/complete-batches.txt
            else
              echo "$batch" >> planner/incomplete-batches.txt
            fi
          done

          complete_count="$(wc -l < planner/complete-batches.txt)"
          incomplete_count="$(wc -l < planner/incomplete-batches.txt)"
          echo "compatible complete batches: $complete_count / 192"
          echo "incomplete batches: $incomplete_count"
          echo "complete_count=$complete_count" >> "$GITHUB_OUTPUT"
          echo "incomplete_count=$incomplete_count" >> "$GITHUB_OUTPUT"

          if (( incomplete_count == 0 )); then
            batches='[192]'
          else
            batches="$(jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)' planner/incomplete-batches.txt)"
          fi
          echo "batches=$batches" >> "$GITHUB_OUTPUT"

      - name: Upload resume plan
        uses: actions/upload-artifact@v4
        with:
          name: finite1721-resume-plan-${{ steps.plan.outputs.tag }}-${{ github.run_id }}
          path: planner/
          if-no-files-found: error
          retention-days: 90

  batches:
    name: finite17-21-batch-${{ matrix.batch }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 135
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        batch: ${{ fromJSON(needs.preflight.outputs.batches) }}
    steps:
      - name: No incomplete batches remain
        if: matrix.batch == 192
        shell: bash
        run: echo "All 192 source-fingerprinted microbatches are already complete."

      - uses: actions/checkout@v4
        if: matrix.batch < 192

      - name: Set up Lean structural dependencies
        if: matrix.batch < 192
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteScanEighthSplit
          test: false
          lint: false
          use-github-cache: false

      - name: Restore compatible resumable batch bundle
        if: matrix.batch < 192
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ matrix.batch }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p batch-out .lake/build/lib/lean/PetersenZeroForcing
          artifact_name="finite1721-batch-$BATCH-$TAG"
          json="$(mktemp)"
          trap 'rm -f "$json"' EXIT
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$artifact_name" \
            -o "$json"
          artifact_id="$(
            jq -r '[.artifacts[] | select(.expired == false)]
              | sort_by(.created_at) | reverse | .[0].id // empty' "$json"
          )"
          if [[ -n "$artifact_id" ]]; then
            zip="$(mktemp)"
            curl -fsSL -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o "$zip"
            unzip -oq "$zip" -d batch-out
            rm -f "$zip"
            if [[ -f batch-out/source-tag.txt && "$(cat batch-out/source-tag.txt)" == "$TAG" ]]; then
              echo "Restored compatible artifact $artifact_id"
            else
              echo "Discarding incompatible restored artifact $artifact_id"
              rm -rf batch-out/*
            fi
          else
            echo "No compatible prior batch artifact."
          fi
          shopt -s nullglob
          for f in batch-out/*.olean; do
            cp "$f" .lake/build/lib/lean/PetersenZeroForcing/
          done

      - name: Kernel-check missing exact eighth leaves
        if: matrix.batch < 192
        shell: bash
        env:
          BATCH: ${{ matrix.batch }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -u -o pipefail
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          mkdir -p batch-out "$outdir"
          echo "$TAG" > batch-out/source-tag.txt
          key="$(printf '%03d' "$BATCH")"
          manifest="batch-out/manifest-batch-$key.tsv"
          printf "module\tstatus\trc\tseconds\tsource_sha256\n" > "$manifest"
          rm -f batch-out/hardfail batch-out/timeouts.txt batch-out/COMPLETE

          mapfile -t sources < <(
            find PetersenZeroForcing -maxdepth 1 -type f \
              \( -name 'FiniteScanCheck17*E[01].lean' \
              -o -name 'FiniteScanCheck18*E[01].lean' \
              -o -name 'FiniteScanCheck19*E[01].lean' \
              -o -name 'FiniteScanCheck20*E[01].lean' \
              -o -name 'FiniteScanCheck21*E[01].lean' \) \
              -print | sort
          )

          if [[ "${#sources[@]}" -ne 1920 ]]; then
            echo "Expected 1920 leaf sources, found ${#sources[@]}" >&2
            printf "__source_count__\tlean-failure-source-count\t98\t0\t-\n" >> "$manifest"
            touch batch-out/hardfail
            exit 0
          fi

          start_index=$((BATCH * BATCH_SIZE))
          assigned=("${sources[@]:start_index:BATCH_SIZE}")
          if [[ "${#assigned[@]}" -ne "$BATCH_SIZE" ]]; then
            echo "Batch $key expected $BATCH_SIZE leaves, got ${#assigned[@]}" >&2
            printf "__batch_size__\tlean-failure-batch-size\t99\t0\t-\n" >> "$manifest"
            touch batch-out/hardfail
            exit 0
          fi

          for src in "${assigned[@]}"; do
            module="$(basename "$src" .lean)"
            sha="$(sha256sum "$src" | awk '{print $1}')"
            sidecar="batch-out/$module.source.sha256"
            status=""
            rc=0
            start="$(date +%s)"

            if [[ -s "batch-out/$module.olean" && -s "$sidecar" && "$(cat "$sidecar")" == "$sha" ]]; then
              cp "batch-out/$module.olean" "$outdir/$module.olean"
              status="reused"
            else
              rm -f "batch-out/$module.olean" "$sidecar" "$outdir/$module.olean"
              echo "batch=$key checking $module with timeout $LEAF_TIMEOUT"
              if timeout --signal=TERM --kill-after=30s "$LEAF_TIMEOUT" \
                  lake env lean "$src" -o "$outdir/$module.olean"; then
                if [[ -s "$outdir/$module.olean" ]]; then
                  cp "$outdir/$module.olean" "batch-out/$module.olean"
                  printf "%s\n" "$sha" > "$sidecar"
                  status="success"
                else
                  status="lean-failure-no-olean"
                  rc=97
                  touch batch-out/hardfail
                fi
              else
                rc=$?
                rm -f "$outdir/$module.olean"
                if [[ $rc -eq 124 || $rc -eq 137 || $rc -eq 143 ]]; then
                  status="timeout"
                  printf "%s\n" "$module" >> batch-out/timeouts.txt
                else
                  status="lean-failure-$rc"
                  touch batch-out/hardfail
                fi
              fi
            fi

            end="$(date +%s)"
            seconds=$((end - start))
            printf "%s\t%s\t%s\t%s\t%s\n" \
              "$module" "$status" "$rc" "$seconds" "$sha" >> "$manifest"
          done

      - name: Mark complete batch
        id: completeness
        if: always() && matrix.batch < 192
        shell: bash
        run: |
          set -euo pipefail
          complete=true
          if [[ -f batch-out/hardfail || -s batch-out/timeouts.txt ]]; then
            complete=false
          fi
          count_olean="$(find batch-out -maxdepth 1 -type f -name '*.olean' | wc -l)"
          count_sha="$(find batch-out -maxdepth 1 -type f -name '*.source.sha256' | wc -l)"
          if [[ "$count_olean" -ne 10 || "$count_sha" -ne 10 ]]; then
            complete=false
          fi
          if [[ "$complete" == true ]]; then
            echo "complete" > batch-out/COMPLETE
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "batch completeness: $complete"

      - name: Upload resumable batch bundle
        if: always() && matrix.batch < 192
        uses: actions/upload-artifact@v4
        with:
          name: finite1721-batch-${{ matrix.batch }}-${{ needs.preflight.outputs.tag }}
          path: batch-out/
          if-no-files-found: error
          retention-days: 90

      - name: Upload completed-batch marker
        if: steps.completeness.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finite1721-complete-${{ matrix.batch }}-${{ needs.preflight.outputs.tag }}
          path: batch-out/COMPLETE
          if-no-files-found: error
          retention-days: 90

      - name: Fail only after preserving resumable evidence
        if: always() && matrix.batch < 192
        shell: bash
        run: |
          if [[ -f batch-out/hardfail ]]; then
            echo "Hard Lean/source failure recorded; successful leaves were preserved." >&2
            exit 2
          fi
          if [[ -s batch-out/timeouts.txt ]]; then
            echo "One or more exact eighth leaves timed out; successful leaves were preserved." >&2
            cat batch-out/timeouts.txt >&2
            exit 3
          fi

  assemble:
    name: assemble-finite-through-21
    if: always()
    needs: [preflight, batches]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean and current structural modules
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PetersenZeroForcing.FiniteReduction PetersenZeroForcing.LargeLowerBound PetersenZeroForcing.FiniteScanEighthSplit
          test: false
          lint: false
          use-github-cache: false

      - name: Restore exact cumulative artifact through n=16
        uses: actions/download-artifact@v5
        with:
          name: finite-checked-through-16
          path: .lake/build/lib/lean
          github-token: ${{ github.token }}
          run-id: ${{ env.FINITE16_RUN_ID }}

      - name: Restore newest compatible bundle for every later microbatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          mkdir -p "$outdir" later-bundles finite-status
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          restored=0
          for batch in $(seq 0 191); do
            artifact_name="finite1721-batch-$batch-$TAG"
            meta="$tmp/meta-$batch.json"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$artifact_name" \
              -o "$meta"
            artifact_id="$(
              jq -r '[.artifacts[] | select(.expired == false)]
                | sort_by(.created_at) | reverse | .[0].id // empty' "$meta"
            )"
            if [[ -z "$artifact_id" ]]; then
              echo "No artifact for batch $batch"
              continue
            fi
            zip="$tmp/$batch.zip"
            dir="later-bundles/$(printf '%03d' "$batch")"
            mkdir -p "$dir"
            curl -fsSL -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o "$zip"
            unzip -oq "$zip" -d "$dir"
            if [[ -s "$dir/source-tag.txt" && "$(cat "$dir/source-tag.txt")" == "$TAG" ]]; then
              shopt -s nullglob
              for f in "$dir"/*.olean; do
                cp "$f" "$outdir/"
              done
              for f in "$dir"/manifest-batch-*.tsv; do
                cp "$f" finite-status/
              done
              restored=$((restored + 1))
            fi
          done
          echo "Compatible batch artifacts restored: $restored / 192" | tee finite-status/restored-batches.txt

          if compgen -G 'finite-status/manifest-batch-*.tsv' > /dev/null; then
            awk -F '\t' 'FNR>1 {count[$2]++} END {for (k in count) print k, count[k]}' \
              finite-status/manifest-batch-*.tsv | sort | tee finite-status/status-counts.txt
          fi

      - name: Rebuild current shared finite structures after restores
        shell: bash
        run: |
          set -euo pipefail
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          lake env lean PetersenZeroForcing/FiniteScanOctantSplit.lean \
            -o "$outdir/FiniteScanOctantSplit.olean"
          lake env lean PetersenZeroForcing/FiniteScanEighthSplit.lean \
            -o "$outdir/FiniteScanEighthSplit.olean"

      - name: Require all 1920 exact eighth leaves
        shell: bash
        run: |
          set -euo pipefail
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          missing_file="finite-status/missing-leaves.txt"
          : > "$missing_file"
          required=0
          for src in $(
            find PetersenZeroForcing -maxdepth 1 -type f \
              \( -name 'FiniteScanCheck17*E[01].lean' \
              -o -name 'FiniteScanCheck18*E[01].lean' \
              -o -name 'FiniteScanCheck19*E[01].lean' \
              -o -name 'FiniteScanCheck20*E[01].lean' \
              -o -name 'FiniteScanCheck21*E[01].lean' \) \
              -print | sort
          ); do
            module="$(basename "$src" .lean)"
            required=$((required + 1))
            if [[ ! -s "$outdir/$module.olean" ]]; then
              echo "$module" >> "$missing_file"
            fi
          done
          missing="$(wc -l < "$missing_file")"
          printf "required=%s\nmissing=%s\n" "$required" "$missing" | tee finite-status/coverage.txt
          test "$required" -eq 1920
          test "$missing" -eq 0

      - name: Reconstruct all exact later parents, pairs, and scan theorems
        shell: bash
        run: |
          set -euo pipefail
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          for n in 17 18 19 20 21; do
            for suffix in OuterPair0 OuterPair1 OuterPair2 InnerPair0 InnerPair1 InnerPair2; do
              stem="FiniteScanCheck$n$suffix"
              lake env lean "PetersenZeroForcing/$stem.lean" -o "$outdir/$stem.olean"
            done
            lake env lean "PetersenZeroForcing/FiniteScanChecked$n.lean" \
              -o "$outdir/FiniteScanChecked$n.olean"
          done

      - name: Compile lower_bound_finite and root
        shell: bash
        run: |
          set -euo pipefail
          outdir=".lake/build/lib/lean/PetersenZeroForcing"
          lake env lean PetersenZeroForcing/FiniteLowerBound.lean \
            -o "$outdir/FiniteLowerBound.olean"
          lake env lean PetersenZeroForcing.lean \
            -o .lake/build/lib/lean/PetersenZeroForcing.olean

      - name: Upload campaign status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite17-21-status-${{ github.run_id }}
          path: finite-status/
          if-no-files-found: warn
          retention-days: 90

      - name: Save cumulative finite checked modules through n=21
        uses: actions/upload-artifact@v4
        with:
          name: finite-checked-through-21
          path: |
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanOctantSplit.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanEighthSplit.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck13*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck14*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck15*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck16*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck17*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck18*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck19*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck20*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanCheck21*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteScanChecked*.olean
            .lake/build/lib/lean/PetersenZeroForcing/FiniteLowerBound.olean
            .lake/build/lib/lean/PetersenZeroForcing.olean
          if-no-files-found: error
          retention-days: 90
